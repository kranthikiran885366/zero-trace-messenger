name: Record Demo Video

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Public site URL to record'
        required: true
        default: 'https://7f9f07ec90e14c4eb9786c1a581ba4c2-d013ba103e97449584c25fa43.fly.dev'

permissions:
  contents: write
  pull-requests: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Record walkthrough
        env:
          SITE_URL: ${{ inputs.site_url }}
        run: npx playwright test -c scripts/playwright.config.ts --reporter=list

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v2

      - name: Convert video to MP4
        run: |
          set -e
          file=$(find demo-video -type f -name '*.webm' | head -n1)
          echo "Found video: $file"
          mkdir -p public/demos
          ffmpeg -y -i "$file" -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p public/demos/securechat-demo.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: securechat-demo-video
          path: public/demos/securechat-demo.mp4

      - name: Create Pull Request with video asset
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(docs): add auto-generated demo video"
          branch: auto/demo-video
          title: "Add auto-generated demo video"
          body: |
            This PR adds a recorded walkthrough video to public/demos/securechat-demo.mp4

            - Source: ${{ inputs.site_url }}
            - Generated by GitHub Actions Playwright recorder
          labels: documentation
          add-paths: |
            public/demos/securechat-demo.mp4
